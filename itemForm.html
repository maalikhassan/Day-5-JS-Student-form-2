<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="app-brand">My Shop</div>
        <nav class="app-nav">
            <a class="nav-link" href="index.html">Dashboard</a>
            <a class="nav-link" href="customerForm.html">Customers</a>
            <a class="nav-link active" href="itemForm.html">Items</a>
        </nav>
    </header>

    <main class="formBox">
        <div class="card">
            <h1>Item Form</h1>

            <label for="txtName">Name</label>
            <input type="text" id="txtItem" placeholder="Item name">

            <label for="txtCategory">Category</label>
            <input type="text" id="txtCategory" placeholder="e.g. Electronics">

            <label for="txtqty">Quantity</label>
            <input type="number" id="txtqty" placeholder="e.g. 10">

            <label for="txtprice">Price</label>
            <input type="text" id="txtprice" placeholder="0.00">

            <button id="btnItemPrint" type="button" onclick="addItem();">Save Item</button>
        <!-- =================================================================== -->
            <h2>Added Items</h2>

            <table id="itemsTable" border="1">
            </table>
        </div>
    </main>

    <script src="js/item.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
